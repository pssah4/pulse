  <text class="pd-mono" x="655" y="192" text-anchor="middle">pulse status</text>
  <text x="655" y="207" text-anchor="middle">from a local cache</text>
  <rect class="pd-card" x="720" y="70" width="260" height="164" rx="14"/>
  <text class="pd-h" x="744" y="104">GitHub, the sync database</text>
  <text x="744" y="126">The board, one record per item</text>
  <rect class="pd-chip" x="744" y="146" width="46" height="26" rx="13"/>
  <text x="767" y="163" text-anchor="middle">type</text>
  <rect class="pd-chip" x="798" y="146" width="53" height="26" rx="13"/>
  <text x="824.5" y="163" text-anchor="middle">ready</text>
  <rect class="pd-chip" x="859" y="146" width="86" height="26" rx="13"/>
  <text x="902" y="163" text-anchor="middle">who has it</text>
