<svg class="pd" viewBox="0 0 1000 250" role="img" aria-labelledby="wl-title">
  <title id="wl-title">Business analyses, specs and Plans are Markdown files on item branches. GitHub holds the item catalog and relationships; a shared Git branch holds claims, holds, results and integration state. pulse new registers work, pulse claim reserves it, and pulse go verifies and integrates results before closing items. pulse status reads a local view. Personal actions enter a durable local outbox; only confirmed synchronization grants team authority.</title>
