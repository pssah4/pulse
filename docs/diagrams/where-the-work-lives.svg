  <text x="80.5" y="199" text-anchor="middle">features</text>
  <rect class="pd-chip" x="125" y="182" width="53" height="26" rx="13"/>
  <text x="151.5" y="199" text-anchor="middle">plans</text>
  <rect class="pd-people" x="410" y="118" width="180" height="76" rx="14"/>
  <text class="pd-h" x="500" y="161" text-anchor="middle">People and agents</text>
  <path class="pd-edge" d="M410 156H284" marker-end="url(#wl-head)"/>
  <text x="345" y="130" text-anchor="middle">read the spec,</text>
  <text x="345" y="145" text-anchor="middle">build</text>
  <path class="pd-edge" d="M590 140H716" marker-end="url(#wl-head)"/>
  <text class="pd-mono" x="655" y="114" text-anchor="middle">pulse claim,</text>
  <text class="pd-mono" x="655" y="129" text-anchor="middle">pulse done</text>
