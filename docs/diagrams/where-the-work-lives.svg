<svg class="pd" viewBox="0 0 1000 250" role="img" aria-labelledby="wl-title">
  <title id="wl-title">Business analysis, epics, features, and plans are Markdown files in your repository. GitHub keeps the board, one record per item with its type, whether it is ready, who has it, what it waits for, and whether it is done. pulse new registers a new item on the board. People and agents claim and finish items with pulse claim and pulse done, read the board with pulse status from a local cache, and read the spec in the repository to build.</title>
  <defs>
    <marker id="wl-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="pd-head" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <path class="pd-edge" d="M150 70V46Q150 36 160 36H840Q850 36 850 46V68" marker-end="url(#wl-head)"/>
  <rect class="pd-bg" x="398" y="24" width="204" height="22"/>
  <text x="500" y="40" text-anchor="middle"><tspan class="pd-mono">pulse new</tspan> registers a new item</text>
  <rect class="pd-card" x="20" y="70" width="260" height="164" rx="14"/>
  <text class="pd-h" x="44" y="104">Your repository</text>
  <text x="44" y="126">Markdown next to the code</text>
  <rect class="pd-chip" x="44" y="146" width="132" height="26" rx="13"/>
  <text x="110" y="163" text-anchor="middle">business analysis</text>
  <rect class="pd-chip" x="184" y="146" width="53" height="26" rx="13"/>
  <text x="210.5" y="163" text-anchor="middle">epics</text>
