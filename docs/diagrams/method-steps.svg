  <rect class="pd-node" x="780" y="86" width="200" height="84" rx="12"/>
  <text class="pd-cmd" x="880" y="116" text-anchor="middle">/pulse-build</text>
  <text x="880" y="138" text-anchor="middle">spec tests first,</text>
  <text x="880" y="156" text-anchor="middle">one branch per feature</text>
  <path class="pd-edge" d="M880 170V195Q880 203 872 203H110Q102 203 102 211V234" marker-end="url(#ms-head)"/>
  <rect class="pd-node" x="20" y="236" width="164" height="84" rx="12"/>
  <text class="pd-h" x="102" y="266" text-anchor="middle">tests</text>
  <text x="102" y="288" text-anchor="middle">verify</text>
