<svg class="pd" viewBox="0 0 1000 384" role="img" aria-labelledby="ms-title">
  <title id="ms-title">The method in nine steps. /pulse-ba establishes why and for whom; /pulse-re writes epics and features. Valid published specs proceed to planning without early approval. /pulse-build writes spec tests first on the item branch. Tests, review and security audit verify the result; a red gate gets one fix round followed by tests. Green review or audit evidence may carry to a new commit only when its Git tree is identical. If contents change, both checks run again. Pulse publishes the result and integrates it into the shared base with exact head and base binding. Regular results integrate automatically by default; manual final approval is optional. Missing product input holds only dependent work.</title>
  <defs>
    <marker id="ms-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="pd-head" d="M0 0L10 5L0 10z"/></marker>
  </defs>
