  <rect class="pd-node" x="527" y="86" width="200" height="84" rx="12"/>
  <text class="pd-h" x="627" y="108" text-anchor="middle">planning</text>
  <text x="627" y="126" text-anchor="middle">how: tasks, files</text>
  <text x="627" y="143" text-anchor="middle"><tspan class="pd-mono">/pulse-re</tspan>, <tspan class="pd-mono">/pulse-build</tspan>,</text>
  <text x="627" y="160" text-anchor="middle">or <tspan class="pd-mono">pulse go</tspan> plans</text>
